version: 1

commands:

  - id: rust.check.fast
    cmd: cargo check --all-targets --all-features
    desc: Find out whether it compiles without waiting for a build
    tags: [rust, cargo, check, compile, fast]

  - id: rust.lint.strict
    cmd: cargo clippy --all-targets --all-features -- -D warnings
    desc: Run the lints the way continuous integration will run them
    tags: [rust, cargo, clippy, lint, ci]

  - id: rust.test.one
    cmd: cargo test <filter> -- --nocapture
    desc: Run one test and see everything it printed
    tags: [rust, cargo, test, filter, debug]
    params:
      filter:
        desc: Part of the test name

  - id: rust.test.ignored
    cmd: cargo test -- --ignored
    desc: Run the slow tests that are skipped by default
    tags: [rust, cargo, test, ignored, slow]

  - id: rust.deps.tree
    cmd: cargo tree -i <crate>
    desc: Find out which dependency is pulling in a crate
    tags: [rust, cargo, tree, dependencies, transitive]
    params:
      crate:
        desc: Crate to trace back

  - id: rust.deps.outdated
    cmd: cargo update --dry-run
    desc: See which dependencies have newer versions available
    tags: [rust, cargo, update, dependencies, versions]

  - id: rust.expand.macro
    cmd: cargo expand <path>
    desc: Read what a derive or macro actually generated
    tags: [rust, cargo, expand, macro, derive, debug]
    params:
      path:
        desc: Module path, such as store::definitions

  - id: rust.build.release
    cmd: cargo build --release --target <target>
    desc: Build the optimised binary for another platform
    tags: [rust, cargo, build, release, cross, target]
    params:
      target:
        desc: Target triple, such as x86_64-unknown-linux-gnu

  - id: rust.doc.open
    cmd: cargo doc --no-deps --open
    desc: Read this crate's own documentation as its users will
    tags: [rust, cargo, doc, documentation]

  - id: rust.publish.dry-run
    cmd: cargo publish --dry-run
    desc: Find out what would stop a release before tagging one
    tags: [rust, cargo, publish, release, crates-io]

  - id: rust.clean.target
    cmd: cargo clean
    desc: Delete the build directory when the cache stops making sense
    tags: [rust, cargo, clean, cache, disk]
    danger: true
