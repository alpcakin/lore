# Sample library exercising every schema feature. The real library is split one
# file per namespace.

version: 1

commands:

  # ---------------------------------------------------------------- git ----

  - id: git.log.graph
    cmd: git log --oneline --graph --decorate --all
    desc: Show commit history as a compact graph across all branches
    tags: [git, log, history, graph]

  - id: git.undo.last-commit
    cmd: git reset --soft HEAD~1
    desc: Undo the last commit but keep every change staged
    tags: [git, undo, reset, commit]

  - id: git.search.history
    cmd: git log -S"<text>" --oneline
    desc: Find the commits that introduced or removed a given string
    tags: [git, search, log, pickaxe, blame]
    params:
      text:
        desc: Literal string to look for in diffs

  - id: git.clean.dry-run
    cmd: git clean -nfdx
    desc: Preview which untracked and ignored files a clean would delete
    tags: [git, clean, cleanup, untracked]

  - id: git.diff.stat-vs-base
    cmd: git diff --stat <base:main>...HEAD
    desc: Summarise which files this branch changed against a base branch
    tags: [git, diff, review, branch]
    params:
      base:
        desc: Base branch to compare against

  # ------------------------------------------------------------- docker ----

  - id: docker.ps.custom-format
    cmd: 'docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"'
    desc: List running containers with name, status and port columns only
    tags: [docker, containers, ps, format]

  - id: docker.logs.follow
    cmd: docker logs -f --tail <lines:100> <container>
    desc: Follow the live log output of a running container
    tags: [docker, logs, debug, tail]
    params:
      container:
        desc: Container name or ID
        from: 'docker ps --format "{{.Names}}"'
      lines:
        desc: Number of trailing lines to show before following

  - id: docker.exec.shell
    cmd: docker exec -it <container> <shell:sh>
    desc: Open an interactive shell inside a running container
    tags: [docker, exec, shell, debug]
    params:
      container:
        desc: Container name or ID
        from: 'docker ps --format "{{.Names}}"'
      shell:
        desc: Shell binary to launch, usually sh or bash

  - id: docker.prune.all
    cmd: docker system prune -a --volumes
    desc: Reclaim disk by removing all unused containers, images, networks and volumes
    tags: [docker, cleanup, disk, prune]
    danger: true

  - id: docker.inspect.ip
    cmd: "docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' <container>"
    desc: Print the IP address assigned to a container
    tags: [docker, network, inspect, ip]
    params:
      container:
        desc: Container name or ID
        from: 'docker ps --format "{{.Names}}"'

  # --------------------------------------------------------- kubernetes ----

  - id: k8s.pods.wide
    cmd: kubectl get pods -n <namespace:default> -o wide
    desc: List pods in a namespace including node and IP columns
    tags: [kubernetes, kubectl, pods, namespace]

  - id: k8s.logs.follow
    cmd: kubectl logs -f <pod> -n <namespace:default> --tail <lines:200>
    desc: Follow the live logs of a pod
    tags: [kubernetes, kubectl, logs, debug, tail]
    params:
      pod:
        desc: Pod name
        from: kubectl get pods -o name
      lines:
        desc: Number of trailing lines to show before following

  - id: k8s.exec.shell
    cmd: kubectl exec -it <pod> -n <namespace:default> -- /bin/sh
    desc: Open an interactive shell inside a pod
    tags: [kubernetes, kubectl, exec, shell, debug]
    params:
      pod:
        desc: Pod name
        from: kubectl get pods -o name

  - id: k8s.port-forward
    cmd: kubectl port-forward svc/<service> <local-port>:<remote-port> -n <namespace:default>
    desc: Forward a local port to a service running inside the cluster
    tags: [kubernetes, kubectl, network, port-forward, tunnel]
    params:
      service:
        desc: Service name to forward to
      local-port:
        desc: Port to open on this machine
      remote-port:
        desc: Port the service listens on in the cluster

  # ------------------------------------------------- system and network ----

  - id: sys.ports.listening
    cmd:
      posix: ss -tulpn
      powershell: Get-NetTCPConnection -State Listen | Select-Object LocalAddress, LocalPort, OwningProcess
    desc: List the processes currently listening on TCP and UDP ports
    tags: [network, ports, sockets, listening, troubleshooting]

  - id: sys.port.kill
    cmd:
      posix: lsof -ti tcp:<port> | xargs kill -9
      powershell: Get-NetTCPConnection -LocalPort <port> | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force }
    desc: Kill whatever process is holding a TCP port hostage
    tags: [network, ports, kill, process, troubleshooting]
    danger: true
    params:
      port:
        desc: TCP port number to free

  - id: sys.find.by-name
    cmd:
      posix: find <dir:.> -type f -name "<pattern>"
      powershell: Get-ChildItem -Path <dir:.> -Recurse -File -Filter "<pattern>"
    desc: Find files matching a name pattern under a directory
    tags: [files, search, find, glob]
    params:
      dir:
        desc: Directory to search under
      pattern:
        desc: Filename pattern, wildcards allowed

  - id: sys.disk.top-dirs
    cmd:
      posix: du -sh <dir:.>/* | sort -rh | head -20
      powershell: Get-ChildItem <dir:.> -Directory | Select-Object Name, @{Name='SizeMB';Expression={[math]::Round((Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1MB, 1)}} | Sort-Object SizeMB -Descending | Select-Object -First 20
    desc: Show the twenty largest subdirectories by size
    tags: [disk, usage, size, cleanup, files]
    params:
      dir:
        desc: Directory whose children should be measured

  # ----------------------------------------------------------- security ----

  - id: sec.kics.scan
    cmd: docker run --rm -v <path>:/path checkmarx/kics scan -p /path -o /path/kics-results --report-formats json,html
    desc: Run a KICS infrastructure-as-code security scan and write JSON and HTML reports
    tags: [security, kics, iac, scan, terraform, report]
    params:
      path:
        desc: Absolute path of the directory to scan

  - id: sec.trivy.image
    cmd: trivy image --severity HIGH,CRITICAL --ignore-unfixed <image>
    desc: Scan a container image for high and critical vulnerabilities that have fixes
    tags: [security, trivy, containers, scan, cve, vulnerabilities]
    params:
      image:
        desc: Image reference, for example nginx:latest
