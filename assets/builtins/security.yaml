version: 1

commands:

  - id: sec.trivy.image
    cmd: trivy image --severity HIGH,CRITICAL <image>
    desc: Check a container image for known vulnerabilities before shipping it
    tags: [security, trivy, scan, image, cve, container]
    params:
      image:
        desc: Image reference to scan

  - id: sec.trivy.filesystem
    cmd: trivy fs --scanners vuln,secret,misconfig <path:.>
    desc: Scan a checkout for vulnerable dependencies, secrets and bad config
    tags: [security, trivy, scan, dependencies, secrets]
    params:
      path:
        desc: Directory to scan

  - id: sec.kics.scan
    cmd: kics scan -p <path:.> --report-formats json -o <output:results>
    desc: Check infrastructure as code against the usual misconfigurations
    tags: [security, kics, iac, terraform, kubernetes, scan]
    params:
      path:
        desc: Directory holding the infrastructure code
      output:
        desc: Directory to write the report into

  - id: sec.gitleaks.history
    cmd: gitleaks detect --source <path:.> --redact
    desc: Find secrets that were committed at some point and never removed
    tags: [security, gitleaks, secrets, git, history, leak]
    params:
      path:
        desc: Repository to search

  - id: sec.semgrep.audit
    cmd: semgrep --config auto <path:.>
    desc: Look for known bad patterns in the source rather than in dependencies
    tags: [security, semgrep, sast, static-analysis, audit]
    params:
      path:
        desc: Directory to analyse

  - id: sec.syft.sbom
    cmd: syft <image> -o cyclonedx-json
    desc: Produce the bill of materials a customer or auditor asks for
    tags: [security, syft, sbom, supply-chain, inventory]
    params:
      image:
        desc: Image or directory to inventory

  - id: sec.openssl.inspect-cert
    cmd: openssl x509 -in <path> -noout -text
    desc: Read everything a certificate file claims
    tags: [security, openssl, certificate, inspect, x509]
    params:
      path:
        desc: Certificate file

  - id: sec.password.random
    cmd:
      posix: openssl rand -base64 <bytes:24>
      powershell: '-join ((48..57) + (65..90) + (97..122) | Get-Random -Count <length:24> | ForEach-Object { [char]$_ })'
    desc: Generate a passphrase that nothing has ever seen before
    tags: [security, random, password, secret, generate]
    params:
      bytes:
        desc: How many random bytes to draw
      length:
        desc: How many characters to produce

  - id: sec.gpg.verify
    cmd: gpg --verify <signature> <path>
    desc: Check that a release really came from who it says
    tags: [security, gpg, signature, verify, release]
    params:
      signature:
        desc: Detached signature file
      path:
        desc: File the signature covers
