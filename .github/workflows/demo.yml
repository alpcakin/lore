name: Demo

# Run by hand when the interface changes. The gif comes back as an artifact to
# download and commit, so the repository never carries one nobody can reproduce.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: render
    runs-on: ubuntu-latest
    steps:
      # Third party actions are pinned to a commit rather than a tag: a tag can
      # be moved onto different code without anything here changing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo build --release
      - run: echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"

      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: docs/demo.tape

      - name: Render with the output visible
        run: |
          echo "== can the toolcache ffmpeg write a gif at all =="
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x240:rate=10 \
            -t 1 -y /tmp/probe.gif && ls -l /tmp/probe.gif || echo "toolcache ffmpeg cannot"

          echo "== distribution ffmpeg =="
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          /usr/bin/ffmpeg -version | head -1

          echo "== vhs, distribution ffmpeg first on PATH =="
          PATH="/usr/bin:$PATH" vhs docs/demo.tape || true
          ls -l demo.gif || echo "still no gif"

      - name: Collect the gif
        run: |
          test -f demo.gif || { echo "vhs produced no gif"; exit 1; }
          mv demo.gif docs/demo.gif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gif
          path: docs/demo.gif
          if-no-files-found: error
