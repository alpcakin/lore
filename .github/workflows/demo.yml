name: Demo

# Run by hand when the interface changes. The gif comes back as an artifact to
# download and commit, so the repository never carries one nobody can reproduce.
on:
  workflow_dispatch:

jobs:
  render:
    name: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release
      - run: echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"

      - uses: charmbracelet/vhs-action@v2
        with:
          path: docs/demo.tape

      - uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: docs/demo.gif
          if-no-files-found: error
