name: Release

on:
  push:
    tags: ["v*"]
  # A rehearsal: builds and tests every target and leaves the archives as
  # artifacts, without opening a release or publishing anything. A version
  # number on crates.io can never be reused, so the matrix is worth proving
  # before one is spent.
  workflow_dispatch:

# Read by default. Only the job that opens the release is given more, and only
# that job gets it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every target builds on a runner of its own architecture. Cross compiling
  # would mean a C toolchain for the bundled sqlite on every host, and a native
  # runner exists for all six.
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          # macos-13 was retired, and a job asking for it waits a full day for
          # a runner that never comes before being cancelled. macos-14 is
          # deprecated and heading the same way.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar
          # The one binary that does not care which glibc the host has.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar
            packages: musl-tools

    steps:
      # Third party actions are pinned to a commit rather than a tag: a tag can
      # be moved onto different code without anything here changing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      # A tag can be pushed onto any commit, so nothing is shipped before the
      # suite has run against the code actually being released. Every target is
      # native here, so the tests run on the binary that will be shipped.
      - run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        # rusqlite compiles sqlite3.c, so the musl target needs a compiler that
        # targets musl. Naming it per target leaves build scripts on the host
        # compiler where they belong.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="lore-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/lore.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            asset="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/lore" "$name/"
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi

          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            lore-*.tar.gz
            lore-*.zip
            lore-*.sha256
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect the checksums into one file
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS
          rm -- *.sha256

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*

  # Separate from the release job so that the one holding the registry token
  # never also holds write access to this repository.
  publish:
    name: crates.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      # A fork, or a release cut before the token exists, should still get its
      # archives. The job reports what it skipped instead of failing the run.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set, skipping the crates.io publish"
            exit 0
          fi
          cargo publish --locked
