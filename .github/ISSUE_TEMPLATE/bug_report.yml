name: Bug report
description: Something does not work the way the README says it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
      placeholder: I pressed ctrl+g and the prompt moved down a line, but no picker appeared.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. brew install alpcakin/tap/lore
        2. lore setup
        3. Open a new terminal and press ctrl+g
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: lore version
      description: The output of `lore --version`.
      placeholder: lore 0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Windows (WSL)
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - bash
        - zsh
        - fish
        - PowerShell 7
        - Windows PowerShell 5.1
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: iTerm2, Ghostty, Windows Terminal, GNOME Terminal
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - Shell installer
        - Homebrew
        - Scoop
        - Cargo
        - Prebuilt archive
        - Built from source
